name: SmartUnlock 10-minute soak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/soak.yml'

permissions:
  contents: read

concurrency:
  group: smartunlock-soak
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests with race detector
        run: |
          docker run --rm -v "$PWD:/src" -w /src golang:1.22-bookworm \
            go test -race ./...
      - name: Ten-minute daemon fault-injection soak
        run: |
          docker run --rm -e SMARTUNLOCK_SOAK=1 -v "$PWD:/src" -w /src golang:1.22-bookworm \
            go test ./internal/app -run '^TestDaemonSoak$' -count=1 -v -timeout 11m
